<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Safari Print Test</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:20px;text-align:center}
h1{color:#245fa8}button{display:block;width:300px;max-width:90%;margin:15px auto;padding:15px;font-size:18px;cursor:pointer}.box{margin-top:30px;border:2px solid #245fa8;padding:20px}
</style>
</head>
<body>
<h1>Safari iOS Print Test</h1>
<p>Prueba de impresión mínima para identificar comportamiento de Safari.</p>
<button onclick="printDirect()">Prueba 1 - window.print()</button>
<button onclick="openWindowOnly()">Prueba 2 - Abrir ventana</button>
<button onclick="openWindowAndPrint()">Prueba 3 - Abrir ventana + print()</button>
<div class="box">Este bloque debe aparecer en la vista previa de impresión.</div>
<script>
function printDirect(){alert('Ejecutando window.print()');window.print();}
function openWindowOnly(){const w=window.open('','_blank');if(!w){alert('No fue posible abrir la ventana');return;}w.document.write(`<!DOCTYPE html><html><head><title>Ventana de prueba</title></head><body style="font-family:Arial;padding:40px;"><h1>Ventana abierta correctamente</h1><button onclick="window.print()">Imprimir desde esta ventana</button></body></html>`);w.document.close();}
function openWindowAndPrint(){const w=window.open('','_blank');if(!w){alert('No fue posible abrir la ventana');return;}w.document.write(`<!DOCTYPE html><html><head><title>Print Test</title></head><body style="font-family:Arial;padding:40px;"><h1>Prueba de impresión automática</h1><button onclick="window.print()">Imprimir manualmente</button><script>window.onload=function(){setTimeout(function(){try{window.focus();window.print();}catch(error){console.error(error);}},500);};<\/script></body></html>`);w.document.close();}
</script>
</body>
</html>
